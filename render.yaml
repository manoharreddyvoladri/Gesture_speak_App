services:
  - type: web
    name: syncup
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: SESSION_COOKIE_SAMESITE
        value: Lax
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: gesturespeakdb
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: MAX_ROOM_PARTICIPANTS
        value: "5"
      - key: ROOM_TIMEOUT_HOURS
        value: "24"
      - key: ROOM_CLEANUP_INTERVAL
        value: "300"
      - key: OTP_EXPIRY_MINUTES
        value: "5"
      - key: SESSION_LIFETIME_DAYS
        value: "7"
      - key: LOG_LEVEL
        value: INFO
