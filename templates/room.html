<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(self)">

    <title>SyncUp - {{ room_id }}</title>

    <!-- Stylesheets -->
    <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fonts/manrope.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/syncup.css') }}">
    <link href="{{ url_for('static', filename='css/room.css') }}" rel="stylesheet">

    <!-- Socket.IO + Bootstrap before other scripts -->
    <script src="{{ url_for('static', filename='vendor/socketio/socket.io.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>

    <style>
        :root {
            --primary-color: var(--su-primary);
            --secondary-color: #818cf8;
            --bg-dark: var(--su-call-bg);
            --text-light: var(--su-call-text);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: var(--su-font);
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .conference-container {
            display: grid;
            grid-template-rows: auto 1fr auto;
            height: 100vh;
            width: 100%;
        }

        .room-info-bar {
            background: #161616;
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .room-details {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .room-id {
            font-size: 1rem;
            font-weight: 500;
        }

        .btn-copy {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-light);
            font-size: 0.8125rem;
            padding: 0.3rem 0.75rem;
            border-radius: var(--su-radius-pill);
            cursor: pointer;
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .content-area {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 1rem;
            padding: 1rem;
            height: calc(100vh - 120px);
            overflow: hidden;
        }

        .video-section {
            background: #101010;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .video-grid {
            display: grid;
            gap: 0.5rem;
            padding: 0.5rem;
            height: 100%;
            position: relative;
        }

        /* Dynamic grid layout based on participant count */
        .video-grid[data-count="1"] {
            grid-template-columns: 1fr;
        }

        .video-grid[data-count="2"] {
            grid-template-columns: 1fr 1fr;
        }

        .video-grid[data-count="3"],
        .video-grid[data-count="4"] {
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
        }

        .video-grid[data-count="5"],
        .video-grid[data-count="6"] {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            overflow: hidden;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
        }

        .name-tag {
            color: white;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .right-panel {
            background: #161616;
            border-radius: 0.5rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .right-panel.collapsed {
            transform: translateX(calc(100% - 24px));
        }

        .panel-toggle {
            position: absolute;
            left: -24px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 48px;
            background: #161616;
            border-radius: 4px 0 0 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-light);
        }

        .panel-tabs {
            display: flex;
            padding: 0.75rem;
            gap: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-light);
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .tab-btn.active {
            opacity: 1;
            background: rgba(255, 255, 255, 0.1);
        }

        .tab-content {
            flex: 1;
            overflow: hidden;
        }

        .tab-pane {
            display: none;
            height: 100%;
            overflow-y: auto;
            padding: 1rem;
        }

        .tab-pane.active {
            display: block;
        }

        .controls-bar {
            background: #161616;
            padding: 1rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .control-group {
            display: flex;
            gap: 0.75rem;
        }

        .control-button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            font-size: 1.125rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .control-button.active {
            background: #ffffff;
            color: #0b0b0b;
        }

        .control-button.active:hover {
            background: #e4e4e4;
        }

        .control-button.danger {
            background: var(--su-danger);
        }

        .control-button.danger:hover {
            background: var(--su-danger-hover);
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .content-area {
                grid-template-columns: 1fr;
            }

            .right-panel {
                position: fixed;
                right: 0;
                top: 0;
                bottom: 0;
                width: 300px;
                z-index: 1000;
            }

            .video-grid[data-count] {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(auto-fit, 1fr);
            }
        }

        /* Loading spinner */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        /* Connection status */
        .connection-status {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 0.5rem 1rem;
            border-radius: 1rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
            z-index: 1000;
        }

        .connection-status.visible {
            display: flex;
        }

        /* Chat tab */
        .chat-messages {
            height: calc(100% - 48px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .chat-message {
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            background: rgba(255, 255, 255, 0.08);
            font-size: 0.875rem;
            max-width: 90%;
        }

        .chat-message.own {
            align-self: flex-end;
            background: #ffffff;
            color: #0b0b0b;
        }

        .chat-message .chat-meta {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
            font-size: 0.7rem;
            opacity: 0.7;
            margin-bottom: 0.15rem;
        }

        .chat-message.own .chat-meta {
            opacity: 0.6;
        }

        .chat-input {
            display: flex;
            gap: 0.5rem;
        }

        .chat-input input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-light);
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
        }

        .chat-input button {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: white;
            border-radius: 0.375rem;
            padding: 0 0.9rem;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .chat-input button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Participants tab */
        .participant-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 0.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="conference-body">
    <!-- Connection Status -->
    <div id="connectionStatus" class="connection-status">
        <div class="spinner-border text-light" role="status"></div>
        <span>Connecting...</span>
    </div>

    <!-- Main Container -->
    <div class="conference-container">
        <!-- Room Info Bar -->
        <div class="room-info-bar">
            <div class="room-details">
                <span class="su-logo-mark">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="6" width="12" height="12" rx="3" stroke="currentColor" stroke-width="2"/>
                        <path d="M15 9.5l5-3v11l-5-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                <span class="room-id">Room: {{ room_id }}</span>
                <button class="btn-copy" onclick="copyMeetLink()" title="Copy meet link to share">
                    <i class="fas fa-link"></i> Copy link
                </button>
            </div>
            <div class="participant-count">
                <i class="fas fa-users"></i>
                <span id="participantCount">{{ room_data.participants|length }}</span>
            </div>
        </div>

        <!-- Content Area -->
        <div class="content-area">
            <!-- Video Section -->
            <div class="video-section">
                <div id="video-grid" class="video-grid" data-count="{{ room_data.participants|length }}"></div>
            </div>

            <!-- Right Panel -->
            <div class="right-panel" id="rightPanel">
                <!-- Panel Toggle -->
                <div class="panel-toggle" onclick="toggleRightPanel()">
                    <i class="fas fa-chevron-left"></i>
                </div>

                <!-- Panel Tabs -->
                <div class="panel-tabs">
                    <button class="tab-btn active" data-tab="chat">
                        <i class="fas fa-comments"></i> Chat
                    </button>
                    <button class="tab-btn" data-tab="participants">
                        <i class="fas fa-users"></i> People
                    </button>
                </div>

                <!-- Tab Content -->
                <div class="tab-content">
                    <!-- Chat Tab -->
                    <div id="chat" class="tab-pane active">
                        <div class="chat-messages" id="chatMessages"></div>
                        <div class="chat-input">
                            <input type="text" id="messageInput" placeholder="Type a message...">
                            <button onclick="sendMessage()">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Participants Tab -->
                    <div id="participants" class="tab-pane">
                        <div class="participants-list" id="participantsList"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls Bar -->
        <div class="controls-bar">
            <!-- Media Controls -->
            <div class="control-group">
                <button id="toggle-video" class="control-button active" title="Toggle Video">
                    <i class="fas fa-video"></i>
                </button>
                <button id="toggle-audio" class="control-button active" title="Toggle Audio">
                    <i class="fas fa-microphone"></i>
                </button>
                <button id="switch-camera" class="control-button" title="Switch Camera" style="display: none;">
                    <i class="fas fa-sync"></i>
                </button>
            </div>

            <!-- Feature Controls -->
            <div class="control-group">
                <button id="settings" class="control-button" title="Settings">
                    <i class="fas fa-cog"></i>
                </button>
            </div>

            <!-- Leave Control -->
            <div class="control-group">
                <button id="leave-room" class="control-button danger" title="Leave Meeting">
                    <i class="fas fa-phone-slash"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-light">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">Settings</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="settings-section">
                        <h6>Video</h6>
                        <select id="cameraSelect" class="form-select bg-secondary text-light mb-3"></select>

                        <h6>Audio</h6>
                        <select id="microphoneSelect" class="form-select bg-secondary text-light mb-3"></select>

                        <h6>Video Quality</h6>
                        <select id="videoQuality" class="form-select bg-secondary text-light mb-3">
                            <option value="low">Low (360p)</option>
                            <option value="medium" selected>Medium (720p)</option>
                            <option value="high">High (1080p)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Error Modal -->
    <div class="modal fade" id="errorModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-light">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">Connection Error</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p id="errorMessage"></p>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="retryConnection()">Retry</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // Constants from Flask
        const ROOM_ID = "{{ room_id }}";
        const USERNAME = "{{ username }}";
        const ROOM_LINK = "{{ room_link }}";
    </script>
    <script src="{{ url_for('static', filename='js/call.js') }}"></script>

    <!-- Initialize page -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize modals
            const settingsModal = new bootstrap.Modal(document.getElementById('settingsModal'));
            const errorModal = new bootstrap.Modal(document.getElementById('errorModal'));

            // Initialize tabs
            const tabBtns = document.querySelectorAll('.tab-btn');
            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const tabId = btn.dataset.tab;
                    switchTab(tabId);
                });
            });

            // Copy the shareable meet link (not just the room code) - anyone
            // logged in who opens this link is added to the room automatically.
            window.copyMeetLink = () => {
                navigator.clipboard.writeText(ROOM_LINK).then(() => {
                    const btn = document.querySelector('.btn-copy');
                    const icon = btn.querySelector('i');
                    const originalHTML = btn.innerHTML;
                    icon.className = 'fas fa-check';
                    btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                    setTimeout(() => {
                        btn.innerHTML = originalHTML;
                    }, 2000);
                });
            };

            // Right panel toggle function
            window.toggleRightPanel = () => {
                const panel = document.getElementById('rightPanel');
                panel.classList.toggle('collapsed');
                const icon = panel.querySelector('.panel-toggle i');
                icon.classList.toggle('fa-chevron-left');
                icon.classList.toggle('fa-chevron-right');
            };

            // Tab switching function
            window.switchTab = (tabId) => {
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));

                document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
                document.getElementById(tabId).classList.add('active');
            };

            // Retry connection function
            window.retryConnection = () => {
                errorModal.hide();
                window.location.reload();
            };

            // Settings button
            document.getElementById('settings')?.addEventListener('click', () => {
                settingsModal.show();
            });

            document.getElementById('videoQuality')?.addEventListener('change', function () {
                window.videoCall?.setVideoQuality(this.value);
            });

            document.getElementById('switch-camera')?.addEventListener('click', () => {
                window.videoCall?.switchToNextCamera();
            });

            // Chat
            window.sendMessage = () => {
                const input = document.getElementById('messageInput');
                if (!input || !window.videoCall) return;
                const text = input.value.trim();
                if (!text) return;
                window.videoCall.sendChatMessage(text);
                input.value = '';
            };

            document.getElementById('messageInput')?.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    window.sendMessage();
                }
            });
        });

    </script>
</body>
</html>
