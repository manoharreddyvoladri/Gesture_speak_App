<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error or "Error" }} - SyncUp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fonts/manrope.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/syncup.css') }}">
    <style>
        body {
            background: var(--su-call-bg);
            color: var(--su-call-text);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-container {
            text-align: center;
            padding: 2rem;
            max-width: 480px;
        }

        .error-container .su-logo {
            justify-content: center;
            margin-bottom: 2rem;
        }

        .error-message {
            font-size: 1.375rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .error-detail {
            color: #9aa0a6;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <span class="su-logo">
            <span class="su-logo-mark">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="6" width="12" height="12" rx="3" stroke="currentColor" stroke-width="2"/>
                    <path d="M15 9.5l5-3v11l-5-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
            <span class="su-logo-word">SyncUp</span>
        </span>
        <p class="error-message">{{ error or "Something went wrong" }}</p>
        <p class="error-detail">{{ message or "Please try again." }}</p>
        <a href="{{ url_for('land') }}" class="su-btn su-btn-primary">Back to SyncUp</a>
    </div>
</body>
</html>
